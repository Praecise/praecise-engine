[package]
name = "praecise-moe"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Praecise Engine expert-parallel MoE execution: per-expert SwiGLU FFNs from safetensors blobs, top-k gating, GGUF block-quantized expert weights, a byte-bounded expert residency cache, and the combine step, on the CPU, CUDA (cuBLAS) or any other GPU through wgpu."

[dependencies]
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.13"
dashmap = "6"
base64 = "0.23"
sha2 = "0.11"
ndarray = "0.17"
safetensors = "0.8"
half = "2"
# Available memory, for the auto-sized expert residency budget.
sysinfo = "0.39"
# NVIDIA: cuBLAS grouped GEMM for expert projections. The driver is loaded at
# run time.
cudarc = { version = "0.19.10", optional = true, default-features = false, features = ["std", "cublas", "driver", "dynamic-loading"] }
# Any other GPU: WGSL compute through wgpu.
wgpu = { version = "30.0.1", optional = true }
pollster = { version = "1", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }

[features]
default = []
# NVIDIA: the CUDA version of the bindings comes from nvcc (or CUDARC_CUDA_VERSION)
# at build time. cuda-12 and cuda-13 pin it on a build host without a toolkit.
cuda = ["dep:cudarc", "cudarc/cuda-version-from-build-system"]
cuda-12 = ["cuda", "cudarc/cuda-12040"]
cuda-13 = ["cuda", "cudarc/cuda-13000"]
wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
