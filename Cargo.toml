[workspace]
resolver = "2"
members = [
  "praecise-hardware",
  "praecise-runtime",
  "praecise-ffi",
  "praecise-host",
  "praecise-remote",
  "praecise-diffusion",
  "praecise-codec",
  "praecise-onnx",
  "praecise-perception",
  "praecise-moe",
  "praecise-provenance",
  "praecise-train",
  "llama-cpp-sys-2",
  "llama-cpp-2",
  "examples/embeddings",
  "examples/simple",
  "examples/reranker",
  "examples/mtmd",
  "examples/flux2",
  "examples/ace-step",
  "examples/cosmos3",
  "examples/wan-world",
  "examples/qwen-image",
  "examples/ltx2",
]

[workspace.dependencies]
# core library deps
thiserror = "2"
tracing = "0.1"
tracing-core = "0.1"

# examples and benchmarks
hf-hub = { version = "1.0.0", features = ["blocking", "rustls-tls"] }
criterion = "0.8.2"
pprof = "0.15.0"
# Without its `prettyplease` feature: bindgen 0.73 parses with syn 2 and
# accepts prettyplease up to 0.3, which moved to syn 3, so with both in the
# lockfile bindgen does not compile. The generated bindings are the same;
# they are formatted by rustfmt when it is installed and left as emitted
# otherwise.
bindgen = { version = "0.73.2", default-features = false, features = ["logging", "runtime"] }
cc = "1.11.1"
anyhow = "1.0.104"
clap = "4.6.7"
encoding_rs = "0.8.44"
tracing-subscriber = { version = "0.3", features = ["json"] }

[workspace.lints.rust]
missing_docs = { level = "warn" }
missing_debug_implementations = { level = "warn" }

[workspace.lints.clippy]
pedantic = { level = "warn" }
