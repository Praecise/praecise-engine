[package]
name = "praecise-train"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Praecise Engine training substrate: the deterministic replayable step, the hash-linked step log, content-hashed checkpoints with lineage, objectives, optimizers and parameter-delta primitives, on the same ggml graphs and backends that serve the model."

[dependencies]
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
llama-cpp-2 = { path = "../llama-cpp-2", optional = true }
llama-cpp-sys-2 = { path = "../llama-cpp-sys-2", optional = true }

[features]
default = ["engine"]
# Steps on the engine: LoRA SFT on the serving graph.
engine = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2"]
cuda = ["engine", "llama-cpp-2/cuda"]
metal = ["engine", "llama-cpp-2/metal"]

[lints]
workspace = true
