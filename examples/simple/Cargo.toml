[package]
name = "simple"
version = "0.1.154"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
llama-cpp-2 = { path = "../../llama-cpp-2", version = "0.1.69" }
hf-hub = { workspace = true }
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
encoding_rs = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
cuda = ["llama-cpp-2/cuda"]
metal = ["llama-cpp-2/metal"]
vulkan = ["llama-cpp-2/vulkan"]
mkl = ["llama-cpp-2/mkl"]
rocm = ["llama-cpp-2/rocm"]
sycl = ["llama-cpp-2/sycl"]
openvino = ["llama-cpp-2/openvino"]
opencl = ["llama-cpp-2/opencl"]
hexagon = ["llama-cpp-2/hexagon"]
cann = ["llama-cpp-2/cann"]
musa = ["llama-cpp-2/musa"]
webgpu = ["llama-cpp-2/webgpu"]
zdnn = ["llama-cpp-2/zdnn"]
zendnn = ["llama-cpp-2/zendnn"]
kleidiai = ["llama-cpp-2/kleidiai"]
blas = ["llama-cpp-2/blas"]
et = ["llama-cpp-2/et"]
virtgpu = ["llama-cpp-2/virtgpu"]

[lints]
workspace = true
