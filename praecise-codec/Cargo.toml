[package]
name = "praecise-codec"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Praecise Engine video codecs: in-process H.264, H.265 and AV1 decoding and H.264 and AV1 encoding in MP4 and WebM, with Opus sound."

[dependencies]
thiserror = "2"
libc = "0.2"
# H.264 encode, built from the bundled source (BSD-2-Clause).
openh264 = { version = "0.9.8", default-features = false, features = ["source"] }
# H.264 and H.265 decode, pure Rust (MIT OR Apache-2.0).
rust_h264 = "0.4.0"
rust_h265 = "0.1.0"
# AV1 encode, pure Rust (BSD-2-Clause); no assembly, so no assembler is needed.
rav1e = { version = "0.8.1", default-features = false, features = ["threading"] }
# AV1 decode, pure Rust (BSD-2-Clause); no assembly, as above.
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
# Opus sound, libopus built from the bundled source (BSD-3-Clause).
opus = "0.4.0"
# Container readers (MIT; Zlib OR MIT OR Apache-2.0). The writers are in this crate.
re_mp4 = "0.5.1"
matroska-demuxer = "0.8.1"

[lints]
workspace = true
