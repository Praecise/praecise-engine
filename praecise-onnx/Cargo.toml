[package]
name = "praecise-onnx"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Praecise Engine ONNX model families: speech-to-text, object detection, promptable and text-prompted segmentation, image encoders, time-series forecasting and text embedding, on ONNX Runtime with the execution provider the machine's GPU needs."

[dependencies]
praecise-hardware = { path = "../praecise-hardware" }
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.13"
base64 = "0.23"
# ONNX Runtime. `download-binaries` fetches a prebuilt runtime where one
# exists; a target with no prebuilt CUDA download links a CUDA ONNX Runtime
# through ORT_LIB_LOCATION. `copy-dylibs` places the execution-provider
# libraries (libonnxruntime_providers_*.so) next to the built binary.
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
  "std",
  "ndarray",
  "download-binaries",
  "tls-rustls",
  "copy-dylibs",
  # External data held in memory, for a parse in a confined process.
  "api-18",
] }
ndarray = "0.17"
# Image decode and resize for vision, detection and segmentation inputs.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Tokenizers for text encoders and speech decoders. `onig` enables the
# SentencePiece pre-tokenizer used by XLM-R-family models.
tokenizers = { version = "0.23.2", default-features = false, features = ["onig", "esaxx_fast"] }
# Audio decode, resample and FFT for speech-to-text.
hound = "3.5"
symphonia = { version = "0.6", default-features = false, features = [
  "mp3",
  "flac",
  "wav",
  "isomp4",
  "ogg",
  "vorbis",
] }
rubato = "5"
realfft = "3.4"
# Probes whether the TensorRT runtime library is installed, so a CUDA build
# puts the TensorRT execution provider ahead of CUDA only where it can load.
libloading = { version = "0.9", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# NVIDIA: the CUDA and TensorRT execution providers.
cuda = ["ort/cuda", "ort/tensorrt", "dep:libloading"]
# AMD: the MIGraphX execution provider. ONNX Runtime removed its ROCm
# provider in 1.23, so MIGraphX is the one that runs on ROCm.
rocm = ["ort/migraphx"]
# Intel: the OpenVINO execution provider, on the GPU and, when asked for, the
# NPU.
openvino = ["ort/openvino"]
# Qualcomm: the QNN execution provider, on the Adreno GPU and, when asked
# for, the Hexagon NPU (needs a QNN-built ONNX Runtime through
# ORT_LIB_LOCATION).
qnn = ["ort/qnn"]
# Huawei: the CANN execution provider for Ascend NPUs (needs a CANN-built
# ONNX Runtime through ORT_LIB_LOCATION).
cann = ["ort/cann"]
# AMD: the Vitis AI execution provider for the XDNA NPU, used when the NPU is
# asked for (needs a Vitis-AI-built ONNX Runtime through ORT_LIB_LOCATION).
vitis = ["ort/vitis"]
# Windows: DirectML, on any vendor's DirectX 12 GPU.
directml = ["ort/directml"]
# WebGPU, on any vendor's GPU: the provider for a GPU whose own feature is
# not built.
webgpu = ["ort/webgpu"]
# Marks a build whose GPU path is Vulkan. ONNX Runtime has no Vulkan
# provider, so such a build refuses ONNX models on a GPU instead of running
# them on the CPU, unless a provider for that GPU is built too.
vulkan = []
# Apple: the CoreML execution provider.
coreml = ["ort/coreml"]
