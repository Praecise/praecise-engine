[package]
name = "praecise-diffusion"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Praecise Engine diffusion family: native flow-matching image generation on the same ggml backend, device and memory budget as the language-model family."

[dependencies]
llama-cpp-sys-2 = { path = "../llama-cpp-sys-2", default-features = false }
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2"
memmap2 = "0.9"
rand = "0.10"
rand_chacha = "0.10"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
praecise-codec = { path = "../praecise-codec" }

[features]
default = []
cuda = ["llama-cpp-sys-2/cuda"]
metal = ["llama-cpp-sys-2/metal"]

[lints]
workspace = true
