[package]
name = "praecise-host"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Praecise Engine runtime hosts: model engines and job engines run as confined child processes (namespaces, Landlock, seccomp) spoken to over a line-delimited JSON channel on their standard streams, with streamed events."

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[dependencies]
parking_lot = "0.13"
praecise-hardware = { path = "../praecise-hardware" }
praecise-runtime = { path = "../praecise-runtime", default-features = false }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"

[lints]
workspace = true

[[test]]
name = "confinement"
harness = false

[[test]]
name = "engines"
harness = false

[[test]]
name = "jobs"
harness = false

[[bin]]
name = "praecise-job"
path = "src/bin/praecise-job.rs"
